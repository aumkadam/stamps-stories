<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Stamps & Stories: a travel passport of places I've been.">
<title>Stamps &amp; Stories</title>
<style>
:root { color-scheme: light; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
.owner-pill { position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; background: var(--ink, #1a1d1f); color: var(--bg, #ecebe7); border-radius: 999px; font: 700 12px "Barlow Condensed", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 6px 18px rgba(0,0,0,.2) }
.owner-pill button { border: 0; border-radius: 999px; padding: 4px 10px; background: var(--bg, #ecebe7); color: var(--ink, #1a1d1f); font: inherit; cursor: pointer }
</style>
<script src="shim.js"></script>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: passport-cover hero holding a tiltable ID page (photo, fields, MRZ) → flight log arc line through every trip in order → stamp page (one ink stamp per place) → recent film. A place opens a film-strip viewer. */
:root {
  --bg: #ecebe7;
  --surface: #f8f7f4;
  --ink: #1a1d1f;
  --muted: #5c6267;
  --line: #d2cfc7;
  --accent: #1d4e7a;
  --accent-ink: #ffffff;
  --ink-1: #1f3a5f; --ink-2: #4b5d23; --ink-3: #2f6690; --ink-4: #3d4f5c; --ink-5: #7a2621;
  --film: #151719;
  --f-display: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root { color-scheme: light }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5 }
h1, h2, h3 { margin: 0; text-wrap: balance }
button, input, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.label { font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .22em; text-transform: uppercase }
.icon { width: 16px; height: 16px; flex: none }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 9px 16px; font-weight: 700; font-size: 15px; text-decoration: none; transition: transform .15s, border-color .15s, background .15s }
.btn:hover { border-color: var(--ink); transform: translateY(-1px) }
.btn.gold { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.on-dark { background: rgba(255,255,255,.08); color: #f2efe6; border-color: rgba(255,255,255,.22) }
.btn.on-dark:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.5) }
.btn[disabled] { opacity: .5; cursor: default; transform: none }
.round { width: 42px; height: 42px; padding: 0; border-radius: 50% }

/* ---------- passport cover hero ---------- */
.cover { color: var(--ink); background:
  repeating-radial-gradient(circle at 18% 120%, transparent 0 22px, rgba(26,29,31,.06) 22px 23px),
  repeating-radial-gradient(circle at 110% -10%, transparent 0 30px, rgba(26,29,31,.05) 30px 31px),
  linear-gradient(180deg, #e3e1db, var(--bg)); overflow: hidden; border-bottom: 1px solid var(--line) }
.cover .btn.on-dark { background: var(--surface); color: var(--ink); border-color: var(--line) }
.cover .btn.on-dark:hover { border-color: var(--ink) }
.cover .wrap { padding-block: 22px 56px }
.cover { position: relative }
.cover .wrap { position: relative; z-index: 2 }
.herobg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: grayscale(1) contrast(1.08) brightness(1.06) }
.herotint { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); mix-blend-mode: color; opacity: .55 }
.herotint + .herotint { mix-blend-mode: multiply; opacity: .12 }
.cover:has(.herobg)::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, rgba(236,235,231,.95) 0%, rgba(236,235,231,.82) 40%, rgba(236,235,231,.25) 75%, rgba(236,235,231,.1) 100%) }

/* stamp editor dialog: fixed header and footer, one scrolling body, live preview on the left */
.sheet.sheet-xl { width: min(940px, 100%); height: min(780px, calc(100dvh - 32px)); padding: 0; gap: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden }
.sx-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line) }
.sx-head h2 { font-size: 1.8rem }
.sx-main { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0 }
.sx-preview { padding: 24px 20px; border-right: 1px solid var(--line); background: var(--bg); display: grid; align-content: start; justify-items: center; gap: 10px }
.sx-preview .stamp { width: 180px; transform: none; pointer-events: none }
.sx-body { overflow-y: auto; overflow-x: hidden; padding: 4px 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; align-content: start; scrollbar-gutter: stable }
.sx-sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; padding-block: 18px; border-bottom: 1px solid var(--line) }
.sx-sec:last-child { border-bottom: 0 }
.sx-title { font-family: var(--f-cond); font-weight: 700; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent) }
.sx-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface) }
.sx-foot .err { flex: 1; min-width: 0 }
.sx-btns { display: flex; gap: 8px; margin-left: auto }
.sheet-xl .mpick, .sheet-xl .scrollbox { border: 1px solid var(--line); border-radius: 4px; padding: 8px; background: var(--bg) }
.sheet-xl .mpick button, .sheet-xl .scrollbox button { background: var(--surface) }
.sheet-xl .mpick button[aria-pressed="true"], .sheet-xl .scrollbox button[aria-pressed="true"] { background: var(--ink) }
.scrollbox { max-height: 168px; overflow-y: auto }
.sheet-xl .mpick { max-height: 250px }
.sx-body, .sheet-xl .mpick, .scrollbox { scrollbar-width: thin; scrollbar-color: var(--muted) transparent }
.sx-body::-webkit-scrollbar, .sheet-xl .mpick::-webkit-scrollbar, .scrollbox::-webkit-scrollbar { width: 8px }
.sx-body::-webkit-scrollbar-thumb, .sheet-xl .mpick::-webkit-scrollbar-thumb, .scrollbox::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px }
.sx-body::-webkit-scrollbar-thumb:hover, .sheet-xl .mpick::-webkit-scrollbar-thumb:hover, .scrollbox::-webkit-scrollbar-thumb:hover { background: var(--muted) }
@media (max-width: 720px) {
  .sheet.sheet-xl { height: calc(100dvh - 24px) }
  .sx-main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) }
  .sx-preview { border-right: 0; border-bottom: 1px solid var(--line); grid-auto-flow: column; justify-content: center; align-items: center; padding: 10px }
  .sx-preview .stamp { width: 84px }
  .sx-body { padding-inline: 16px }
  .sheet-xl .mpick { max-height: 200px }
}

/* ---------- interactions ---------- */
.pp-flip { position: relative; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.3,.7,.2,1) }
.pp-flip.flipped { transform: rotateY(180deg) }
.pp-face { backface-visibility: hidden; -webkit-backface-visibility: hidden }
.passport.pp-back { position: absolute; inset: 0; transform: rotateY(180deg); display: flex; flex-direction: column; overflow: hidden }
.pp-flipbtn { margin-left: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 3px; padding: 2px 7px; font: 600 10px var(--f-cond); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; position: relative; z-index: 3 }
.pp-flipbtn:hover { border-color: var(--ink) }
.visas { flex: 1; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px 10px; padding: 16px 4px 4px; overflow: auto }
.visa { --c: var(--accent); --r: 0deg; transform: rotate(var(--r)); border: 2px solid var(--c); color: var(--c); border-radius: 4px; padding: 6px 10px 5px; display: grid; gap: 1px; min-width: 96px; outline: 1px dashed color-mix(in srgb, var(--c) 45%, transparent); outline-offset: 2px }
.visa b { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .04em; line-height: 1.05 }
.visa span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase }
.visa small { font-family: var(--f-mono); font-size: 9px; opacity: .75 }
.visa-empty { color: var(--muted); font-size: 14px; padding: 20px 4px }
.stamps .stamp { transform: rotate(var(--r)) }
.stamps .stamp:hover, .stamps .stamp:focus-visible { transform: perspective(700px) rotateX(var(--ty, 0deg)) rotateY(var(--tx, 0deg)) scale(1.08) }
.stamps .stamp.lit { transform: rotate(0) scale(1.12); filter: drop-shadow(0 0 0 transparent) drop-shadow(0 6px 14px color-mix(in srgb, var(--c) 40%, transparent)) }
.stamps .stamp.press { animation: thunk .3s ease-out forwards }
@keyframes thunk { 0% { transform: scale(1.08) } 40% { transform: scale(.86) rotate(-3deg) } 100% { transform: scale(1) rotate(0) } }
.sortsel { width: auto; cursor: pointer }
.secnav { position: fixed; left: 0; right: 0; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); transform: translateY(-110%); transition: transform .3s ease }
.secnav.show { transform: none }
.secnav-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)) }
.secnav-in::-webkit-scrollbar { display: none }
.secnav button { flex: none; border: 0; background: none; padding: 7px 12px; border-radius: 3px; font: 700 13px var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.secnav button:hover { color: var(--ink) }
.secnav button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent) }
.secnav .sn-cta { margin-left: auto; color: var(--ink); border: 1px solid var(--line) }
.totop { position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; box-shadow: 0 6px 18px rgba(26,29,31,.15); cursor: pointer }
.totop:hover { border-color: var(--ink) }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 80; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 4px; font-weight: 600; font-size: 14px; transition: opacity .25s, transform .25s; max-width: calc(100% - 32px) }
.toast.show { opacity: 1; transform: translate(-50%, 0) }
.nexttrips { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding-block: 32px 8px }
.nt { --c: var(--accent); display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); text-decoration: none; color: var(--ink); transition: border-color .2s, transform .2s; min-width: 0 }
.nt:hover { border-color: var(--c); transform: translateY(-2px) }
.nt.next { justify-content: flex-end; text-align: right }
.nt-stamp { width: 58px; flex: none; color: var(--c) }
.nt-stamp svg { display: block; width: 100% }
.nt-txt { display: grid; gap: 2px; min-width: 0 }
.nt-txt small { font: 700 11px var(--f-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--c) }
.nt-txt b { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere }
.nt-txt span { font-size: 13px; color: var(--muted) }
.lb .stage img { transition: transform .25s ease; cursor: zoom-in }
.lb .stage img.zoom { transform: scale(2.2); cursor: zoom-out }
.reel { cursor: grab }
.reel.dragging { cursor: grabbing; scroll-behavior: auto }
.reel.dragging button { pointer-events: none }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; font-size: 14px }
kbd { font: 600 12px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 3px 8px; background: var(--bg); justify-self: start }
@media (max-width: 560px) { .nexttrips { grid-template-columns: 1fr } .nt.next { justify-content: flex-start; text-align: left; flex-direction: row-reverse } }
@media (prefers-reduced-motion: reduce) { .pp-flip, .secnav, .toast, .lb .stage img { transition: none } .stamps .stamp.press { animation: none } }

/* videos */
.reel button, .strip button { position: relative }
.reel video, .strip video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; background: #000 }
.vbadge { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; pointer-events: none }
.screen video.main { width: 100%; height: 100%; object-fit: contain; background: #000 }
.lb .stage video { max-width: 100%; max-height: 100%; background: #000 }
@media (max-width: 820px) { .cover:has(.herobg)::before { background: linear-gradient(180deg, rgba(236,235,231,.92), rgba(236,235,231,.72) 60%, rgba(236,235,231,.55)) } }
.cover-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--gold) }
.cover-top .label { color: var(--accent) }
.crest { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink) }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; align-items: center; margin-top: 40px }
.hero-copy h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(3.6rem, 10vw, 7.2rem); line-height: .92; letter-spacing: .01em; text-transform: uppercase; display: grid; gap: 0; justify-items: start }
.hero-copy h1 .n1, .hero-copy h1 .n2 { display: block; max-width: 100%; overflow-wrap: anywhere }
.hero-copy h1 .n1 { color: var(--ink) }
.hero-copy h1 .n2 { color: var(--accent) }
.hero-copy .tag { font-size: clamp(1.1rem, 2.2vw, 1.35rem); margin: 18px 0 0; max-width: 34ch; color: var(--ink) }
.hero-copy .bio { margin: 10px 0 0; max-width: 52ch; color: var(--muted) }
.hero-copy .muted-hint { opacity: .6 }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px }

/* ID page */
.passport-stage { perspective: 1200px }
.passport { --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%; position: relative; background:
    repeating-linear-gradient(115deg, rgba(26,29,31,.03) 0 2px, transparent 2px 9px), var(--surface);
  color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 22px; box-shadow: 0 22px 44px rgba(26,29,31,.16), 0 1px 0 rgba(255,255,255,.8) inset;
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .25s ease-out; transform-style: preserve-3d }
.passport::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(40% 40% at var(--mx) var(--my), rgba(255,255,255,.6), transparent 70%),
    linear-gradient(115deg, transparent 30%, rgba(140,170,200,.18) 45%, rgba(212,163,82,.22) 55%, transparent 70%);
  mix-blend-mode: soft-light }
.pp-head { display: flex; justify-content: space-between; gap: 10px; font-family: "Barlow Condensed", var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px }
.pp-body { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 18px; padding-top: 16px }
.photo { position: relative; aspect-ratio: 4 / 5; border-radius: 3px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); max-width: 100% }
.photo img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) contrast(1.02) }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; font-size: 12px; padding: 8px }
.photo button { position: absolute; inset: 0; border: 0; background: transparent; color: transparent }
.photo button:hover { background: rgba(20,22,24,.6); color: #fff; font-weight: 600; font-size: 13px }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; min-width: 0 }
.fields div { min-width: 0 }
.fields .full { grid-column: 1 / -1 }
.fields small { display: block; font-family: "Barlow Condensed", var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent) }
.fields b { display: block; font-family: "Barlow", var(--f-body); font-weight: 600; font-size: 17px; letter-spacing: .02em; color: var(--ink); overflow-wrap: anywhere; font-variant-numeric: tabular-nums }
.fields .soc { color: var(--ink); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--ink) 35%, transparent); position: relative; z-index: 2 }
.fields .soc:hover { border-bottom-color: var(--ink) }
.fields .soc span { font-size: .8em }
.mini-stamp { position: absolute; right: 18px; top: 44px; transform: rotate(-12deg); border: 2px solid var(--ink-1); color: var(--ink-1); border-radius: 6px; padding: 2px 8px; font-family: var(--f-display); font-weight: 400; letter-spacing: .12em; font-size: 15px; opacity: .75 }
.mrz { margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: clamp(9px, 1.6vw, 12.5px); letter-spacing: .12em; color: var(--muted); white-space: nowrap; overflow: hidden; line-height: 1.6 }

/* ---------- sections ---------- */
section.block { padding-block: 56px 8px }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 22px }
.sec-head .label { color: var(--accent) }
.sec-head h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1; text-transform: uppercase; letter-spacing: .02em }
.sec-head p { margin: 6px 0 0; color: var(--muted); max-width: 52ch }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 8px 12px; font-size: 14px; width: 200px; max-width: 100% }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 26px }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; font-family: var(--f-cond); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 3px; padding: 6px 13px; font-size: 14px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

/* flight log */
.routebox { position: relative; width: 100%; padding: 0; border-radius: 6px; background:
  radial-gradient(120% 90% at 50% 40%, var(--surface), color-mix(in srgb, var(--accent) 6%, var(--surface))); border: 1px solid var(--line); overflow: visible }
.routebox svg { display: block; width: 100%; height: auto; overflow: visible }
.routebox .mapbg .grat { fill: none; stroke: color-mix(in srgb, var(--accent) 18%, var(--line)); stroke-width: 1; opacity: .7 }
.routebox .mapbg .grat.prime { stroke: color-mix(in srgb, var(--accent) 30%, var(--line)); stroke-dasharray: 6 5 }
.routebox .mapbg .deg { fill: var(--muted); font-family: var(--f-mono); font-size: 9px; letter-spacing: .08em; opacity: .75 }
.routebox .mapbg .rose circle { fill: none; stroke: color-mix(in srgb, var(--accent) 35%, var(--line)); stroke-width: 1.2 }
.routebox .mapbg .rose .thin { stroke-dasharray: 2 3 }
.routebox .mapbg .rose .pt { fill: color-mix(in srgb, var(--accent) 55%, transparent) }
.routebox .mapbg .rose .pt.dim { fill: color-mix(in srgb, var(--accent) 22%, transparent) }
.routebox .mapbg .rose .n { fill: var(--accent); font-weight: 700; font-size: 11px; opacity: .8 }
.routebox .mapbg .scale rect { fill: color-mix(in srgb, var(--accent) 45%, transparent); stroke: color-mix(in srgb, var(--accent) 45%, transparent); stroke-width: 1 }
.routebox .mapbg .scale rect.hollow { fill: var(--surface) }
.route-stat { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase }
.routebox .arc { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 7; opacity: .55 }
.routebox .arc-done { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round }
.routebox .node { cursor: pointer; outline: none }

  // Lays the route out to fit the box width, snaking onto new rows when there are many stops.
  let routeRO = null, routeAnim = null;
  function drawRoute() {
    const box = $("#routebox"), svgEl = $("#route-svg");
    if (!box || !svgEl) return;
    const trips = tripOrder(), n = trips.length, w = Math.max(280, box.clientWidth);
    if (n < 2) {
      // Not enough trips for a flight yet: show the chart with the first pin (if any) and a dashed hop to "next stop".
      const h = 280, cy = 140, ax = n ? w * .32 : w * .5, bx = w * .68;
      svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`); svgEl.setAttribute("width", w); svgEl.setAttribute("height", h);
      svgEl.classList.toggle("small", w < 500);
      const t = trips[0];
      svgEl.innerHTML = mapBackdrop(w, h) + (n ? `
        <path class="arc" d="M${ax} ${cy} Q${(ax + bx) / 2} ${cy - 70} ${bx} ${cy}"/>
        <g class="node" data-pid="${esc(t.id)}" data-i="0" tabindex="0" role="link" aria-label="${esc(t.name)}" transform="translate(${ax} ${cy})" style="--c:${inkOf(t)}">
          <circle class="halo" r="16"/><circle class="dot" r="7"/><text class="code" y="34" text-anchor="middle">${esc(t.code)}</text><text class="sub" y="50" text-anchor="middle">${esc((t.when || "").toUpperCase())}</text></g>
        <g class="ghost" transform="translate(${bx} ${cy})"><circle r="7"/><text class="code" y="34" text-anchor="middle">???</text><text class="sub" y="50" text-anchor="middle">NEXT STOP</text></g>
        <path class="plane" transform="translate(${(ax + bx) / 2} ${cy - 36}) rotate(0) scale(1.1)" d="M0-10 2-2 10 2v2l-8-2v6l3 2v2l-5-1-5 1v-2l3-2v-6l-8 2V2l8-4z"/>`
        : `<g class="ghost" transform="translate(${ax} ${cy})"><circle r="7"/><text class="code" y="34" text-anchor="middle">START</text><text class="sub" y="50" text-anchor="middle">ADD YOUR FIRST TRIP</text></g>`);
      box._pts = n ? [{ t, x: ax, y: cy }] : [];
      if (routeRO) routeRO.disconnect();
      let lastW0 = box.clientWidth;
      routeRO = new ResizeObserver(() => { if (Math.abs(box.clientWidth - lastW0) > 4) { lastW0 = box.clientWidth; drawRoute(); } });
      routeRO.observe(box);
      return;
    }
    const per = Math.max(2, Math.min(n, Math.floor((w - 20) / (w < 500 ? 80 : 120)))), rows = Math.ceil(n / per);
    const pad = w < 500 ? 30 : 56, rowH = w < 500 ? 150 : 180, top = w < 500 ? 120 : 130;
    svgEl.classList.toggle("small", w < 500);
    const colW = per > 1 ? (w - pad * 2) / (per - 1) : 0;
    const pts = trips.map((t, i) => {
      const r = Math.floor(i / per), c = i % per, col = r % 2 ? per - 1 - c : c;
      const span = Math.min(per, n - r * per), offset = r === rows - 1 && span < per && rows === 1 ? 0 : 0;
      return { t, x: pad + colW * (col + offset), y: top + r * rowH };
    });
    if (rows === 1 && n < per) pts.forEach((p, i) => p.x = pad + (w - pad * 2) * (n > 1 ? i / (n - 1) : .5));
    let d = `M${pts[0].x.toFixed(1)} ${pts[0].y}`;
    for (let i = 1; i < n; i++) {
      const a = pts[i - 1], b = pts[i];
      if (a.y === b.y) { const lift = 34 + (hash(a.t.code + b.t.code) % 26); d += ` Q${((a.x + b.x) / 2).toFixed(1)} ${a.y - lift} ${b.x.toFixed(1)} ${b.y}`; }
      else { const side = a.x > w / 2 ? 1 : -1, bulge = side * Math.min(46, pad - 6); d += ` C${(a.x + bulge * 1.6).toFixed(1)} ${a.y} ${(b.x + bulge * 1.6).toFixed(1)} ${b.y} ${b.x.toFixed(1)} ${b.y}`; }
    }
    const h = top + (rows - 1) * rowH + 90;
    svgEl.setAttribute("viewBox", `0 0 ${w} ${h}`); svgEl.setAttribute("width", w); svgEl.setAttribute("height", h);
    svgEl.innerHTML = mapBackdrop(w, h) + `
      <path class="arc" id="route-path" d="${d}"/>
      <path class="arc-done" id="route-done" d="${d}"/>
      ${pts.map((p, i) => `<g class="node" data-pid="${esc(p.t.id)}" data-i="${i}" tabindex="0" role="link" aria-label="${esc(p.t.name)}${p.t.when ? ", " + esc(p.t.when) : ""}" transform="translate(${p.x.toFixed(1)} ${p.y})" style="--c:${inkOf(p.t)}">
        <circle class="halo" r="16"/><circle class="dot" r="7"/>
        <text class="code" y="34" text-anchor="middle">${esc(p.t.code)}</text>
        <text class="sub" y="50" text-anchor="middle">${esc((p.t.when || "").toUpperCase())}</text>
        <text class="num" y="-14" text-anchor="middle">${String(i + 1).padStart(2, "0")}</text></g>`).join("")}
      <g id="plane" class="plane" transform="translate(${pts[0].x} ${pts[0].y})" opacity="0"><path transform="rotate(90) scale(1.1)" d="M0-10 2-2 10 2v2l-8-2v6l3 2v2l-5-1-5 1v-2l3-2v-6l-8 2V2l8-4z"/></g>`;
    const done = $("#route-done"), L = done.getTotalLength();
    done.style.strokeDasharray = `${L} ${L}`; done.style.strokeDashoffset = L;
    box._pts = pts;
    if (routeRO) routeRO.disconnect();
    let lastW = box.clientWidth;
    routeRO = new ResizeObserver(() => { if (Math.abs(box.clientWidth - lastW) > 4) { lastW = box.clientWidth; cancelAnimationFrame(routeAnim); drawRoute(); } });
    routeRO.observe(box);
  }
  // Chart-style backdrop: curved graticule, degree labels, compass rose and a scale bar.
  function mapBackdrop(w, h) {
    const cx = w / 2, sp = Math.max(70, w / 12), nM = Math.ceil(cx / sp) + 1, rows = 6;
    let g = "";
    for (let k = -nM; k <= nM; k++) {
      const x = cx + k * sp, bow = k * sp * .22;
      g += `<path class="grat${k === 0 ? " prime" : ""}" d="M${(x - bow * .3).toFixed(1)} -10 Q${(x + bow).toFixed(1)} ${h / 2} ${(x - bow * .3).toFixed(1)} ${h + 10}"/>`;
      if (k % 2 === 0 && x > 30 && x < w - 30) { const deg = Math.abs(k) * 15; g += `<text class="deg" x="${x.toFixed(1)}" y="14" text-anchor="middle">${deg === 0 ? "0°" : deg + "°" + (k < 0 ? "W" : "E")}</text>`; }
    }
    for (let r = 1; r < rows; r++) {
      const y = h * r / rows, sag = (r - rows / 2) * 10;
      g += `<path class="grat${r === rows / 2 ? " prime" : ""}" d="M-10 ${y.toFixed(1)} Q${cx} ${(y + sag).toFixed(1)} ${w + 10} ${y.toFixed(1)}"/>`;
      const lat = Math.abs(rows / 2 - r) * 30;
      g += `<text class="deg" x="8" y="${(y - 4).toFixed(1)}">${lat === 0 ? "EQ" : lat + "°" + (r < rows / 2 ? "N" : "S")}</text>`;
    }
    const rx = w - 52, ry = 62, R = 26;
    const rose = `<g class="rose" transform="translate(${rx} ${ry})">
      <circle r="${R}"/><circle r="${R - 6}" class="thin"/>
      <path class="pt" d="M0 -${R + 6} L5 -5 L0 0 L-5 -5z"/><path class="pt dim" d="M0 ${R + 6} L5 5 L0 0 L-5 5z"/>
      <path class="pt dim" d="M${R + 6} 0 L5 5 L0 0 L5 -5z"/><path class="pt dim" d="M-${R + 6} 0 L-5 5 L0 0 L-5 -5z"/>
      <path class="pt dim" d="M14 -14 L3 -1 L0 0 L1 -3zM-14 14 L-3 1 L0 0 L-1 3zM14 14 L1 3 L0 0 L3 1zM-14 -14 L-1 -3 L0 0 L-3 -1z"/>
      <text class="deg n" y="-${R + 10}" text-anchor="middle">N</text></g>`;
    const sx = 18, sy = h - 18, seg = Math.min(46, w / 10);
    const scale = `<g class="scale" transform="translate(${sx} ${sy})">
      <rect width="${seg}" height="5"/><rect x="${seg}" width="${seg}" height="5" class="hollow"/><rect x="${seg * 2}" width="${seg}" height="5"/>
      <text class="deg" y="-5">0</text><text class="deg" x="${seg * 3}" y="-5" text-anchor="end">${(3000).toLocaleString()} km</text></g>`;
    return `<defs><clipPath id="mapclip"><rect width="${w}" height="${h}" rx="6"/></clipPath></defs><g class="mapbg" clip-path="url(#mapclip)" aria-hidden="true">${g}${w > 420 ? rose : ""}${scale}</g>`;
  }
  function showRouteTip(g) {
    const box = $("#routebox"), tip = $("#rtip"); if (!box || !tip) return;
    const p = box._pts[+g.dataset.i]; if (!p) return;
    const t = p.t, cover = coverOf(t), n = photosOf(t.id).length;
    tip.innerHTML = `${cover ? `<img src="${src(cover.assetId)}" alt="">` : `<div class="rt-motif" style="color:${inkOf(t)}">${MOTIFS[motifOf(t)].svg}</div>`}
      <div class="rt-body"><b>${esc(t.name)}</b><span>${esc([t.country, t.when].filter(Boolean).join(" · ") || "No date yet")}</span><span>${n ? plural(n, "photo") : "No photos yet"} · Stop ${+g.dataset.i + 1}</span></div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight, bw = box.clientWidth;
    tip.style.left = Math.max(4, Math.min(bw - tw - 4, p.x - tw / 2)) + "px";
    tip.style.top = (p.y + 12 - th - 22 < 0 ? p.y + 12 + 62 : p.y + 12 - th - 22) + "px";
    box.querySelectorAll(".node.on").forEach(x => x !== g && x.classList.remove("on")); g.classList.add("on");
  }
  function hideRouteTip() { const tip = $("#rtip"); if (tip) tip.hidden = true; document.querySelectorAll("#routebox .node.on").forEach(x => x.classList.remove("on")); }
  function flyRoute() {
    const box = $("#routebox"), path = $("#route-path"), done = $("#route-done"), plane = $("#plane"), btn = $("#route-play");
    if (!box || !path) return;
    cancelAnimationFrame(routeAnim);
    const L = path.getTotalLength(), pts = box._pts, nodes = [...box.querySelectorAll(".node")];
    nodes.forEach(n => n.classList.remove("hit"));
    if (reduced()) { done.style.strokeDashoffset = 0; nodes.forEach(n => n.classList.add("hit")); return; }
    const dur = Math.min(14000, 1200 * pts.length), t0 = performance.now();
    plane.setAttribute("opacity", "1"); if (btn) { btn.disabled = true; btn.textContent = "Flying…"; }
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2, len = L * e;
      const a = path.getPointAtLength(len), b = path.getPointAtLength(Math.min(L, len + 1));
      const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      plane.setAttribute("transform", `translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${(ang).toFixed(1)})`);
      done.style.strokeDashoffset = L - len;
      pts.forEach((p, i) => { if (Math.hypot(p.x - a.x, p.y - a.y) < 14) nodes[i].classList.add("hit"); });
      if (k < 1) routeAnim = requestAnimationFrame(step);
      else { nodes.forEach(n => n.classList.add("hit")); setTimeout(() => plane.setAttribute("opacity", "0"), 600); if (btn) { btn.disabled = false; btn.textContent = "▶ Fly again"; } }
    };
    routeAnim = requestAnimationFrame(step);
  }

  // ---------- uploads ----------
  async function shrink(file, max = 2400) {
    try {
      const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      if (scale === 1 && file.size < 3e6) return file;
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.86));
    } catch { return file; }
  }
  const why = e => e?.code === "unsupported_type" ? " (format not supported, use JPG, PNG, MP4 or MOV)" : e?.code === "too_large" ? " (too large: photos up to 20 MB, videos up to 50 MB)" : e?.message ? " (" + e.message + ")" : "";
  async function uploadFiles(files, pid) {
    const list = [...files].filter(f => f.type.startsWith("image/") || f.type.startsWith("video/") || /\.(heic|heif|mov|mp4|webm)$/i.test(f.name));
    if (!list.length || !state.assets) return;
    state.uploading = { done: 0, total: list.length }; render();
    const failed = [];
    for (const f of list) {
      try {
        const video = f.type.startsWith("video/") || /\.(mov|mp4|webm)$/i.test(f.name);
        const blob = video ? (f.type ? f : new Blob([f], { type: /\.mov$/i.test(f.name) ? "video/quicktime" : "video/mp4" })) : await shrink(f);
        const res = await state.assets.upload(blob);
        await state.db.collection("photos").add({ placeId: pid, assetId: res.id, createdAt: Date.now(), ...(video ? { kind: "video" } : {}) });
      }
      catch (e) { failed.push(f.name + why(e)); }
      state.uploading.done++; render();
    }
    state.uploading = null; render();
    if (list.length > failed.length) toast(plural(list.length - failed.length, "photo") + " added");
    if (failed.length) confirmBox("Some photos didn't upload", failed.join(", "), "OK");
  }
  async function uploadAvatar(file) {
    if (!file || !state.assets) return;
    document.querySelectorAll('[data-act="avatar"]').forEach(b => { b.disabled = true; b.textContent = "Uploading…"; });
    try {
      const res = await state.assets.upload(await shrink(file, 1600));
      const old = state.profile.photoAssetId;
      await saveProfile({ photoAssetId: res.id });
      if (old) state.assets.delete(old).catch(() => {});
      const av = document.querySelector("#modal .av"); if (av) av.outerHTML = `<img class="av" src="${src(res.id)}" alt="">`;
      document.querySelectorAll('#modal [data-act="avatar"]').forEach(b => { b.disabled = false; b.textContent = "Change photo"; });
    } catch (e) { render(); confirmBox("Photo didn't upload", (file.name || "Photo") + why(e), "OK"); }
  }

      case "vpick": state.view = +t.dataset.i; render(); break;
      case "full": openLB(photosOf(place.id), state.view); break;
      case "open-recent": openLB([...state.photos].sort((a, b) => byTime(b, a)).slice(0, 18), +t.dataset.i); break;

          await state.db.doc("photos/" + ph.id).delete(); state.assets?.delete(ph.assetId).catch(() => {});
        }); break; }
      case "del-place": {
        if (!place) break; const n = photosOf(place.id).length;
        confirmBox(`Delete ${place.name}?`, n ? `This also deletes its ${plural(n, "photo")}.` : "This stamp has no photos.", "Delete stamp", async () => {
          for (const ph of photosOf(place.id)) { await state.db.doc("photos/" + ph.id).delete(); state.assets?.delete(ph.assetId).catch(() => {}); }
          await state.db.doc("places/" + place.id).delete(); location.hash = "";
        }); break; }
    }
  });

  document.addEventListener("keydown", e => { const g = e.target.closest?.("#routebox .node"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = encodeURIComponent(g.dataset.pid); } });

  document.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.x; if (Math.abs(dx) > 4) { drag.moved = true; drag.r.classList.add("dragging"); } drag.r.scrollLeft = drag.s - dx; });
  document.addEventListener("pointerup", () => { if (!drag) return; const d = drag; setTimeout(() => d.r.classList.remove("dragging")); drag = d.moved ? { ...d, eat: true } : null; setTimeout(() => { drag = null; }); });

  });

    const n = photosOf(place.id).length; state.view = (state.view + (dx < 0 ? 1 : -1) + n) % n; render();
  });
  window.addEventListener("hashchange", () => { closeLB(); state.view = 0; window.scrollTo(0, 0); render(); });

  // ---------- boot ----------
  async function boot() {
    if (!window.claude?.use) { state.error = "This page couldn't start. Refresh to try again."; render(); return; }
    const fail = () => { clearTimeout(timer); if (!state.loaded) { state.error = "Couldn't load the travel data. Refresh the page to try again."; render(); } };
    const timer = setTimeout(fail, 10000);
    const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
    if (!db) { clearTimeout(timer); state.error = "Couldn't load the travel data. Refresh to try again."; render(); return; }
    state.db = db; state.assets = assets;
    state.canEdit = !!assets && ((await user?.canEdit?.()) ?? false);
    const got = { prof: false, places: false, photos: false };
    const ready = () => { if (got.prof && got.places && got.photos) { clearTimeout(timer); state.loaded = true; render(); } };
    db.doc("site/profile").onSnapshot(s => { state.profileExists = s.exists; state.profile = s.data() || {}; got.prof = true; ready(); }, fail);
    db.collection("places").onSnapshot(s => { state.places = s.docs.map(d => ({ id: d.id, ...d.data() })); got.places = true; ready(); }, fail);
    db.collection("photos").onSnapshot(s => { state.photos = s.docs.map(d => ({ id: d.id, ...d.data() })); got.photos = true; ready(); }, fail);
  }
  boot();
})();
</script>

</body>
</html>
